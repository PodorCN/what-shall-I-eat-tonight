name: Validate Options Data

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate data/options.json schema
        run: python3 scripts/validate_data.py

      - name: Check app syntax and restaurant filters
        run: |
          node --check app.js
          node scripts/test_reddit_features.cjs

      - name: Verify published asset versions
        run: python3 scripts/version_assets.py --check
